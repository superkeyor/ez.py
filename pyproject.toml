[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "ez"
version = "11.9.8"
description = "easy stuff"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{name = "Keyor"}]
keywords = ["shell", "cross-platform", "easy", "wrapper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    # dep of dep
    "aiohttp",
    "pydantic",

    # Dates and time zones
    "pytz",
    "tzlocal",
    
    # Files and system
    "Send2Trash",
    "Duplicate-Finder",
    'psutil; sys_platform != "linux"',

    # Desktop, clipboard and credentials
    "pyperclip",
    "keyring",
    "mss",
    'pynput; sys_platform != "linux"',
    'imessage_reader; sys_platform == "darwin"',

    # Office documents and Markdown conversion
    "markitdown[pdf,docx,pptx]",
    "openpyxl",
    "xlsxwriter",
    "xlwt",
    "xlrd",
    "python-docx",
    "python-pptx",
    'docx2pdf; sys_platform != "linux"',

    # PDF processing
    "PyMuPDF",
    "pdfCropMargins",
    "pdfannots",

    # Images
    "Pillow",

    # Data analysis and storage
    "pandas",
    "numpy",
    "pyarrow",  # for ticker.parquet
    # "plotnine",  # python's ggplot2 (not use, use R)

    # HTTP and web
    "requests",
    "webdavclient3",
    "fake_useragent",
    "tldextract",
    "tenacity",

    # Website
    "Flask",
    "flask-cors",
    "flask-ipban",
    "cachelib",
    "gunicorn",

    # Text encoding, HTML/XML and eBooks
    "chardet",
    "beautifulsoup4",
    "lxml",
    "ebooklib",

    # Cloud storage, spreadsheets and calendars
    "dropbox",
    "google-api-python-client",
    "google-auth",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "gspread",
    "gcsa",

    # Email and Microsoft 365
    "yagmail",
    "imap-tools",
    "O365",
]

[project.urls]
Homepage = "https://github.com/superkeyor/ez.py"

# BEGIN GENERATED CLI SCRIPTS
[project.scripts]
pptx2md = "ez.ez:_cli"
docx2md = "ez.ez:_cli"
xlsx2md = "ez.ez:_cli"
pdf2md = "ez.ez:_cli"
# END GENERATED CLI SCRIPTS

[tool.uv.build-backend]
module-root = ""
module-name = "ez"
source-include = ["tests/**", "scripts/publish.py", "publish.sh", "Publish.app/Contents/Resources/script"]
source-exclude = [".DS_Store", "gdrive_secrets.json", "gdrive_token.json", "gcal_secrets.json", "gcal_token.pickle"]
